  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rmat('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---------- BASE COLOR ---------- */\n  /* Sampled from logo: deepest opaque pixel = #00204C */\n  --ub-navy-900:        #00204C;   /* primary ink — logo, headlines, body */\n  --ub-navy-800:        #0a2b5e;\n  --ub-navy-700:        #1b3a72;\n  --ub-navy-600:        #2f4d86;   /* hover for navy fills */\n  --ub-navy-500:        #4a6699;\n  --ub-navy-300:        #93a5c2;\n  --ub-navy-100:        #d6deea;   /* faint navy tint for surfaces */\n  --ub-navy-050:        #ecf0f7;\n\n  /* Steel grey — secondary text, dividers, borders */\n  --ub-steel-900:       #2c3543;\n  --ub-steel-700:       #4f5867;\n  --ub-steel-500:       #7a8392;   /* metadata, captions */\n  --ub-steel-300:       #b8bfc9;\n  --ub-steel-200:       #d6dbe2;\n  --ub-steel-100:       #e6e9ee;   /* borders */\n  --ub-steel-050:       #f1f3f6;\n\n  /* Off-white base — page background */\n  --ub-paper:           #f7f4ee;   /* warm off-white */\n  --ub-paper-soft:      #fbf9f4;\n  --ub-paper-deep:      #ede8dd;\n  --ub-white:           #ffffff;\n\n  /* Muted gold accent — sparingly: rule lines, key stats, milestone marker */\n  --ub-gold-700:        #8a6f2a;\n  --ub-gold-600:        #a78544;   /* primary gold */\n  --ub-gold-500:        #c2a05a;\n  --ub-gold-300:        #d8be86;\n  --ub-gold-100:        #efe4c6;   /* tinted background */\n\n  /* ---------- PASTEL LABEL SYSTEM ---------- */\n  /* From planning brief: labels for project phases */\n  --ub-label-afstemming-bg:   #dbe6f2;   /* pastel blauw — coordination */\n  --ub-label-afstemming-fg:   #2c4a72;\n  --ub-label-locaties-bg:     #dde8dc;   /* pastel groen — locations */\n  --ub-label-locaties-fg:     #3b5b3a;\n  --ub-label-archief-bg:      #e2dfe8;   /* pastel lavendelgrijs — archive */\n  --ub-label-archief-fg:      #4a4660;\n  --ub-label-draaidag-bg:     #efe4c6;   /* pastel goud — shoot day */\n  --ub-label-draaidag-fg:     #6e5520;\n  --ub-label-montage-bg:      #efddd1;   /* pastel peach — edit */\n  --ub-label-montage-fg:      #6b4632;\n  --ub-label-oplevering-bg:   #ebe1c8;   /* pastel zand — delivery */\n  --ub-label-oplevering-fg:   #6b5a2d;\n\n  /* ---------- SEMANTIC FOREGROUND/BACKGROUND ---------- */\n  --fg1:                var(--ub-navy-900);    /* primary text */\n  --fg2:                var(--ub-steel-700);   /* secondary text */\n  --fg3:                var(--ub-steel-500);   /* tertiary, metadata */\n  --fg-on-navy:         var(--ub-paper-soft);\n  --fg-link:            var(--ub-navy-700);\n  --fg-accent:          var(--ub-gold-600);\n\n  --bg-page:            var(--ub-paper);\n  --bg-surface:         var(--ub-white);\n  --bg-surface-deep:    var(--ub-paper-deep);\n  --bg-inverse:         var(--ub-navy-900);\n  --bg-tint:            var(--ub-navy-050);\n\n  --border-hairline:    var(--ub-steel-100);\n  --border-strong:      var(--ub-steel-300);\n  --border-ink:         var(--ub-navy-900);\n\n  /* ---------- TYPOGRAPHY FAMILIES ---------- */\n  --font-display:       \"Oswald\", \"Barlow Condensed\", \"Inter\", system-ui, sans-serif;\n  --font-body:          \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", system-ui, sans-serif;\n  --font-wordmark:      \"Cormorant Garamond\", \"EB Garamond\", Georgia, \"Times New Roman\", serif;\n  --font-mono:          \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* ---------- TYPE SCALE (semantic) ---------- */\n  /* Display — condensed, generous tracking for hero / chapter titles */\n  --type-display-1:     500 88px/0.95 var(--font-display);\n  --type-display-2:     500 64px/1.00 var(--font-display);\n  --type-display-3:     500 44px/1.05 var(--font-display);\n\n  /* Wordmark — use only for \"UNIBARGE\" mark and rare hero accents */\n  --type-wordmark:      400 32px/1.0 var(--font-wordmark);\n\n  /* Headings — condensed sans */\n  --type-h1:            500 40px/1.1 var(--font-display);\n  --type-h2:            500 28px/1.15 var(--font-display);\n  --type-h3:            500 20px/1.2 var(--font-display);\n\n  /* Body — neutral sans */\n  --type-lead:          400 20px/1.55 var(--font-body);\n  --type-body:          400 16px/1.6 var(--font-body);\n  --type-body-sm:       400 14px/1.55 var(--font-body);\n  --type-caption:       500 12px/1.4 var(--font-body);\n\n  /* Eyebrow / overline — small caps, tracked */\n  --type-eyebrow:       500 12px/1.2 var(--font-body);\n  --type-eyebrow-tracking: 0.18em;\n\n  /* Numerals (stats) */\n  --type-stat:          500 56px/1 var(--font-display);\n  --type-stat-sm:       500 32px/1 var(--font-display);\n\n  /* ---------- SPACING ---------- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* ---------- RADII ---------- */\n  --radius-none:  0;\n  --radius-xs:    2px;\n  --radius-sm:    4px;\n  --radius-md:    6px;     /* default for cards */\n  --radius-lg:    10px;\n  --radius-pill:  999px;\n\n  /* ---------- SHADOWS ---------- */\n  /* Editorial / quiet — never glowy */\n  --shadow-sm:   0 1px 2px rgba(0, 32, 76, 0.06);\n  --shadow-md:   0 2px 8px rgba(0, 32, 76, 0.08), 0 1px 2px rgba(0, 32, 76, 0.04);\n  --shadow-lg:   0 12px 32px -12px rgba(0, 32, 76, 0.18), 0 2px 6px rgba(0, 32, 76, 0.05);\n  --shadow-rule: inset 0 -1px 0 var(--ub-steel-100);\n\n  /* ---------- MOTION ---------- */\n  --ease-quiet:  cubic-bezier(0.2, 0, 0.1, 1);\n  --dur-fast:    160ms;\n  --dur-mid:     280ms;\n  --dur-slow:    520ms;\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT STYLES\n   ============================================================ */\n\nhtml, body {\n  background: var(--bg-page);\n  color: var(--fg1);\n  font: var(--type-body);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  font-feature-settings: \"ss01\", \"cv11\";\n}\n\nh1 { font: var(--type-h1); letter-spacing: 0.01em; margin: 0; color: var(--fg1); }\nh2 { font: var(--type-h2); letter-spacing: 0.01em; margin: 0; color: var(--fg1); }\nh3 { font: var(--type-h3); letter-spacing: 0.01em; margin: 0; color: var(--fg1); }\n\np  { font: var(--type-body); margin: 0; color: var(--fg2); text-wrap: pretty; }\n\n.ub-display-1 { font: var(--type-display-1); letter-spacing: -0.005em; color: var(--fg1); }\n.ub-display-2 { font: var(--type-display-2); letter-spacing: -0.005em; color: var(--fg1); }\n.ub-display-3 { font: var(--type-display-3); letter-spacing: 0; color: var(--fg1); }\n\n.ub-wordmark {\n  font: var(--type-wordmark);\n  letter-spacing: 0.42em;\n  text-transform: uppercase;\n  color: var(--fg1);\n}\n\n.ub-eyebrow {\n  font: var(--type-eyebrow);\n  letter-spacing: var(--type-eyebrow-tracking);\n  text-transform: uppercase;\n  color: var(--fg3);\n}\n\n.ub-lead {\n  font: var(--type-lead);\n  color: var(--fg1);\n  text-wrap: pretty;\n}\n\n.ub-stat       { font: var(--type-stat);    letter-spacing: -0.01em; color: var(--fg1); }\n.ub-stat-sm    { font: var(--type-stat-sm); letter-spacing: -0.01em; color: var(--fg1); }\n\n.ub-rule          { border: 0; height: 1px; background: var(--border-hairline); }\n.ub-rule--strong  { background: var(--border-strong); }\n.ub-rule--gold    { background: var(--ub-gold-600); height: 2px; }\n\n/* ---- Pastel label utility ---- */\n.ub-label {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 4px 10px;\n  border-radius: var(--radius-pill);\n  font: var(--type-caption);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n}\n.ub-label--afstemming { background: var(--ub-label-afstemming-bg); color: var(--ub-label-afstemming-fg); }\n.ub-label--locaties   { background: var(--ub-label-locaties-bg);   color: var(--ub-label-locaties-fg); }\n.ub-label--archief    { background: var(--ub-label-archief-bg);    color: var(--ub-label-archief-fg); }\n.ub-label--draaidag   { background: var(--ub-label-draaidag-bg);   color: var(--ub-label-draaidag-fg); }\n.ub-label--montage    { background: var(--ub-label-montage-bg);    color: var(--ub-label-montage-fg); }\n.ub-label--oplevering { background: var(--ub-label-oplevering-bg); color: var(--ub-label-oplevering-fg); }\n<\u002Fstyle>\n\n  \n  <style>\n    /* Page setup: A4 portrait, generous margins */\n    @page {\n      size: A4 portrait;\n      margin: 18mm 16mm 16mm 16mm;\n    }\n\n    html, body {\n      background: var(--ub-paper);\n      margin: 0;\n      padding: 0;\n      -webkit-print-color-adjust: exact;\n      print-color-adjust: exact;\n    }\n\n    /* Container — narrower for portrait page width */\n    .page {\n      max-width: 720px;\n      margin: 0 auto;\n      padding: 8mm 0 0;\n    }\n\n    @media print {\n      .page { padding: 0; }\n      /* Avoid splitting key blocks across pages */\n      .week-row,\n      .stat-strip,\n      .open-items,\n      .milestone-end,\n      header.cover { break-inside: avoid; }\n      /* Force the dark \"open items\" block onto its own page so the navy doesn't bleed across a page break */\n      .open-items { break-before: page; }\n    }\n\n    /* --- Layout pieces (mirrors App.jsx visually but tuned for paper) --- */\n\n    .wordmark { display: flex; align-items: center; gap: 12px; }\n    .wordmark img { height: 24px; }\n    .wordmark span {\n      font-family: var(--font-wordmark);\n      font-weight: 500;\n      letter-spacing: 0.42em;\n      font-size: 12px;\n      color: var(--fg1);\n      text-transform: uppercase;\n    }\n\n    .eyebrow {\n      font: var(--type-eyebrow);\n      letter-spacing: var(--type-eyebrow-tracking);\n      text-transform: uppercase;\n      color: var(--fg3);\n    }\n\n    .gold-rule { border: 0; height: 2px; background: var(--ub-gold-600); margin: 0; }\n\n    header.cover {\n      padding-bottom: 36px;\n      border-bottom: 1px solid var(--border-hairline);\n    }\n    header.cover .top {\n      display: flex; justify-content: space-between; align-items: center;\n      margin-bottom: 36px;\n    }\n    header.cover h1 {\n      font: var(--type-display-2);\n      margin: 14px 0 0;\n      letter-spacing: -0.005em;\n      line-height: 0.95;\n      color: var(--fg1);\n    }\n    header.cover .lead {\n      font: var(--type-lead);\n      color: var(--fg2);\n      max-width: 620px;\n      text-wrap: pretty;\n      margin: 18px 0 8px;\n    }\n    header.cover .body {\n      font: var(--type-body);\n      color: var(--fg3);\n      max-width: 620px;\n      text-wrap: pretty;\n      margin: 0;\n    }\n    header.cover .gold-rule { width: 80px; margin: 16px 0 0; }\n\n    /* Stat strip */\n    .stat-strip {\n      display: grid;\n      grid-template-columns: repeat(4, 1fr);\n      gap: 24px;\n      padding: 28px 0;\n      border-bottom: 1px solid var(--border-hairline);\n    }\n    .stat-strip .item { display: flex; flex-direction: column; gap: 8px; }\n    .stat-strip .item hr { width: 28px; }\n    .stat-strip .v {\n      font: var(--type-stat-sm);\n      color: var(--fg1);\n      letter-spacing: -0.01em;\n      font-size: 22px;\n    }\n\n    /* Weekplanner */\n    .chapter {\n      padding: 32px 0 8px;\n    }\n    .chapter h2 {\n      font: var(--type-display-3);\n      font-size: 28px;\n      margin: 10px 0 20px;\n      letter-spacing: -0.005em;\n    }\n    .week-list { display: flex; flex-direction: column; gap: 8px; }\n    .week-row {\n      display: grid;\n      grid-template-columns: 110px 1fr auto;\n      align-items: center;\n      gap: 20px;\n      padding: 12px 16px;\n      background: var(--ub-white);\n      border: 1px solid var(--border-hairline);\n      border-radius: 5px;\n      box-shadow: var(--shadow-sm);\n    }\n    .week-row.is-milestone { background: var(--ub-paper-deep); }\n    .week-row .when {\n      display: flex; flex-direction: column; gap: 2px;\n    }\n    .week-row .when-num {\n      font: var(--type-h3);\n      font-size: 18px;\n      color: var(--fg1);\n      letter-spacing: 0.01em;\n    }\n    .week-row .focus {\n      font: var(--type-lead);\n      font-size: 15px;\n      color: var(--fg1);\n      text-wrap: pretty;\n    }\n    .week-row .labels {\n      display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end;\n    }\n    .week-row .ub-label { font-size: 11px; padding: 4px 10px; }\n\n    /* Open items panel */\n    .open-items {\n      background: var(--ub-navy-900);\n      color: var(--fg-on-navy);\n      padding: 36px 36px;\n      border-radius: 6px;\n      margin-top: 32px;\n    }\n    .open-items .eyebrow { color: var(--ub-gold-300); }\n    .open-items h2 {\n      font: var(--type-display-3);\n      font-size: 26px;\n      margin: 12px 0 0;\n      color: var(--fg-on-navy);\n      letter-spacing: -0.005em;\n    }\n    .open-items hr { width: 56px; margin: 14px 0 22px; }\n    .open-items ul {\n      list-style: none; padding: 0; margin: 0;\n      display: grid; grid-template-columns: 1fr 1fr; gap: 12px 32px;\n    }\n    .open-items li {\n      font: var(--type-body);\n      font-size: 13.5px;\n      color: var(--ub-navy-100);\n      padding-left: 14px;\n      border-left: 1px solid rgba(247,244,238,0.20);\n      text-wrap: pretty;\n    }\n\n    /* Milestone end */\n    .milestone-end {\n      margin-top: 36px;\n      padding: 28px 0 0;\n      border-top: 1px solid var(--border-hairline);\n    }\n    .milestone-end p {\n      font: var(--type-lead);\n      font-size: 15px;\n      color: var(--fg1);\n      margin: 10px 0 0;\n      max-width: 620px;\n      text-wrap: pretty;\n    }\n    .milestone-end em {\n      font-style: normal;\n      color: var(--ub-gold-700);\n      font-weight: 600;\n    }\n\n    /* Footer line — visible on screen + printed on every page bottom */\n    .doc-footer {\n      margin-top: 36px;\n      padding-top: 16px;\n      border-top: 1px solid var(--border-hairline);\n      display: flex;\n      justify-content: space-between;\n      align-items: baseline;\n      font: var(--type-eyebrow);\n      letter-spacing: var(--type-eyebrow-tracking);\n      text-transform: uppercase;\n      color: var(--fg3);\n    }\n  <\u002Fstyle>\n<\u002Fhead>\n<body>\n  <main class=\"page\">\n\n    <header class=\"cover\">\n      <div class=\"top\">\n        <div class=\"wordmark\">\n          <img src=\"88ddc176-48c2-48f6-81a9-c52b8e83d0f3\" alt=\"\">\n          <span>UNIBARGE<\u002Fspan>\n        <\u002Fdiv>\n        <span class=\"eyebrow\">Globale planning · v1<\u002Fspan>\n      <\u002Fdiv>\n      <span class=\"eyebrow\">Jubileumfilm · 20 jaar UniBarge<\u002Fspan>\n      <h1>Globale planning.<\u002Fh1>\n      <hr class=\"gold-rule\">\n      <p class=\"lead\">Een overzicht van de volgende fase, van voorbereiding naar draaidagen en montage.<\u002Fp>\n      <p class=\"body\">Deze planning is bewust globaal opgezet. De exacte invulling maken we samen concreet op basis van de beschikbare schepen, locaties, mensen en het archiefmateriaal vanuit UniBarge.<\u002Fp>\n    <\u002Fheader>\n\n    <section class=\"stat-strip\">\n      <div class=\"item\"><hr class=\"gold-rule\"><span class=\"v\">Mei<\u002Fspan><span class=\"eyebrow\">Voorbereiding<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><hr class=\"gold-rule\"><span class=\"v\">Mei — Juni<\u002Fspan><span class=\"eyebrow\">Draaidagen<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><hr class=\"gold-rule\"><span class=\"v\">Juli<\u002Fspan><span class=\"eyebrow\">Montage<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><hr class=\"gold-rule\"><span class=\"v\">Aug.<\u002Fspan><span class=\"eyebrow\">Oplevering<\u002Fspan><\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"chapter\">\n      <span class=\"eyebrow\">Hoofdstuk 02 · Weekplanner<\u002Fspan>\n      <h2>Hoe de komende weken zijn opgebouwd.<\u002Fh2>\n      <div class=\"week-list\">\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">28 apr.<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Planning en afstemming<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--afstemming\">Afstemming<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">5 mei<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Schepen, mensen en archief in kaart<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--locaties\">Locaties<\u002Fspan><span class=\"ub-label ub-label--archief\">Archief<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">12 mei<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Draaidagen voorbereiden<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--afstemming\">Afstemming<\u002Fspan><span class=\"ub-label ub-label--draaidag\">Draaidag<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">19 mei<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Laatste afstemming voor de draaidagen<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--afstemming\">Afstemming<\u002Fspan><span class=\"ub-label ub-label--draaidag\">Draaidag<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">26 mei<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Eerste scheepsdagen<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--draaidag\">Draaidag<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">2 juni<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Scheepsdagen vervolg<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--draaidag\">Draaidag<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">9 juni<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Simulator en kantoor<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--draaidag\">Draaidag<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">16 juni<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Reservedag + archiefcheck<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--draaidag\">Draaidag<\u002Fspan><span class=\"ub-label ub-label--archief\">Archief<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">23 juni<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Afronding draaidagen<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--draaidag\">Draaidag<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">30 juni<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Overgang naar montage<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--montage\">Montage<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">Juli<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Montage, sound, graphics<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--montage\">Montage<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"week-row is-milestone\">\n          <div class=\"when\"><span class=\"eyebrow\">Week<\u002Fspan><span class=\"when-num\">Aug.<\u002Fspan><\u002Fdiv>\n          <div class=\"focus\">Afwerking en oplevering<\u002Fdiv>\n          <div class=\"labels\"><span class=\"ub-label ub-label--oplevering\">Oplevering<\u002Fspan><\u002Fdiv>\n        <\u002Farticle>\n\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"open-items\">\n      <span class=\"eyebrow\">Volgende afstemming<\u002Fspan>\n      <h2>Wat we graag samen invullen.<\u002Fh2>\n      <hr class=\"gold-rule\">\n      <ul>\n        <li>Welke schepen voor welke scènes inzetbaar zijn<\u002Fli>\n        <li>Welke locaties beschikbaar zijn<\u002Fli>\n        <li>Welke medewerkers of crewleden in beeld kunnen komen<\u002Fli>\n        <li>Welk archiefmateriaal beschikbaar is<\u002Fli>\n        <li>Welke simulator-datum het wordt<\u002Fli>\n      <\u002Ful>\n    <\u002Fsection>\n\n    <section class=\"milestone-end\">\n      <span class=\"eyebrow\">Oplevering<\u002Fspan>\n      <p>Op basis van de huidige planning sturen we op een oplevering in <em>augustus<\u002Fem>, ruim voor publicatie in september.<\u002Fp>\n    <\u002Fsection>\n\n    <footer class=\"doc-footer\">\n      <span>UniBarge · Jubileumfilm · Globale planning v1<\u002Fspan>\n      <span>Pagina opgemaakt voor afdruk<\u002Fspan>\n    <\u002Ffooter>\n\n  <\u002Fmain>\n\n  <script>\n    // Online deelversie — geen auto-print\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
